name: Deploy TransChim
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: transchim-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare secrets and SSH trust
        env:
          APP_ENV: ${{ secrets.ENV_FILE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$APP_ENV" && test -n "$SSH_KNOWN_HOSTS"
          test -n "$SSH_HOST" && test -n "$SSH_USER"
          umask 077
          printf '%s\n' "$APP_ENV" > .env.production
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Build image on GitHub runner
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build -t transchim-web:$GITHUB_SHA .
          docker save transchim-web:$GITHUB_SHA | gzip > /tmp/transchim-image.tar.gz
      - name: Transfer and deploy
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'umask 077; mkdir -p ~/apps/transchim'
          scp /tmp/transchim-image.tar.gz "$SSH_USER@$SSH_HOST:apps/transchim/image.tar.gz"
          scp deploy/compose.yml deploy/rollout.sh "$SSH_USER@$SSH_HOST:apps/transchim/"
          scp .env.production "$SSH_USER@$SSH_HOST:apps/transchim/.env.production"
          ssh "$SSH_USER@$SSH_HOST" "bash ~/apps/transchim/rollout.sh '$GITHUB_SHA'"